name: Build and release

on:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  check:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - id: package
        name: Read the release version
        run: |
          version=$(jq -er '.version | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.-]+)?(\\+[0-9A-Za-z.-]+)?$"))' package.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Require the notes shown on the release page
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          test -s "docs/releases/$VERSION.md" || {
            echo "Write docs/releases/$VERSION.md before building version $VERSION." >&2
            exit 1
          }
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check:links

  # The same core tests on the other two systems. On Windows the files that are
  # verified there are required; the rest still assume a POSIX system in places and
  # are reported without stopping a release.
  test:
    if: ${{ !github.event.deleted }}
    name: Core tests on ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac
            runner: macos-15
          - platform: win
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - if: runner.os != 'Windows'
        run: npm test
      # The runner spells its temporary folder with a short name (RUNNER~1). Windows
      # resolves that to the long name, and the tests compare against what they asked for.
      - name: Use a temporary folder with one spelling
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - name: Run the tests verified on Windows
        if: runner.os == 'Windows'
        run: npm run test:windows
      - name: Report the whole suite on Windows
        if: runner.os == 'Windows'
        continue-on-error: true
        run: npm test

  build:
    needs: check
    name: Package ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win
            runner: windows-2025
            suffixes: win-x64.zip
          - platform: mac
            runner: macos-15
            suffixes: mac-arm64.dmg
          - platform: linux
            runner: ubuntu-24.04
            suffixes: linux-amd64.deb linux-x64.tar.gz
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install the Windows launcher compiler
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $name = 'llvm-mingw-20261117-ucrt-x86_64'
          $archive = Join-Path $env:RUNNER_TEMP "$name.zip"
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/20261117/$name.zip"
          curl.exe --fail --location --retry 3 --output $archive $url
          if ($LASTEXITCODE -ne 0) { throw "Could not download $name" }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash
          if ($hash -ne '4d002e330a0f703625aa5ccbc37e96f8f824413e163bfc7336774aabd2c3a412') { throw 'Compiler checksum mismatch' }
          7z x $archive "-o$env:RUNNER_TEMP" -y -bso0
          if ($LASTEXITCODE -ne 0) { throw "Could not extract $name" }
          $bin = Join-Path $env:RUNNER_TEMP "$name\bin"
          "SESSHUTTLE_MINGW_BIN=$bin" >> $env:GITHUB_ENV
          $bin >> $env:GITHUB_PATH
      - run: npm ci
      - run: npm run package:${{ matrix.platform }}
      - name: Collect installers and their checksums
        shell: bash
        env:
          VERSION: ${{ needs.check.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          SUFFIXES: ${{ matrix.suffixes }}
        run: |
          mkdir installers
          read -ra suffixes <<< "$SUFFIXES"
          for suffix in "${suffixes[@]}"; do
            file="release/sesshuttle-$VERSION-$suffix"
            test -s "$file" || { echo "Missing installer: $file" >&2; exit 1; }
            cp "$file" installers/
          done
          cd installers
          if [[ "$RUNNER_OS" == macOS ]]; then hash=(shasum -a 256); else hash=(sha256sum); fi
          "${hash[@]}" -b sesshuttle-* > "checksums-$PLATFORM.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.platform }}
          path: installers/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true

  # The ZIP is extracted and opened on Windows the way a user opens it: through
  # Sesshuttle.exe, once from an ordinary folder and once from a folder whose name has
  # characters that a file address escapes. Only synthetic data in a temporary folder.
  verify-windows:
    needs: [check, build]
    name: Open the packaged Windows app
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installers-win
          path: installers
      - name: Extract the ZIP
        shell: pwsh
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          $app = Join-Path $env:RUNNER_TEMP 'Sesshuttle app'
          7z x "installers\sesshuttle-$env:VERSION-win-x64.zip" "-o$app" -y -bso0
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract the ZIP' }
          "SESSHUTTLE_APP=$app\Sesshuttle.exe" >> $env:GITHUB_ENV
          # Test mode only accepts a root below the temporary folder, and the runner
          # spells its default one with a short name (RUNNER~1).
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          # The first start of a freshly extracted program is slow on a runner.
          "SESSHUTTLE_LAUNCH_TIMEOUT=120000" >> $env:GITHUB_ENV
          # A Windows fixture names a program for each app. These checks never run it.
          "SESSHUTTLE_FIXTURE_CODEX=$env:SystemRoot\System32\where.exe" >> $env:GITHUB_ENV
      - name: Open the app and list the synthetic conversations
        shell: pwsh
        run: node scripts/smoke.mjs "$env:SESSHUTTLE_APP"
      - name: Open the app from a folder with special characters
        shell: pwsh
        run: node scripts/ui-regressions.mjs --only=location "--app=$env:SESSHUTTLE_APP"

  publish:
    needs: [check, test, build, verify-windows]
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-${{ needs.check.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true
      - name: Publish the verified installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.check.outputs.version }}
        working-directory: installers
        run: bash ../.github/scripts/publish-release.sh
